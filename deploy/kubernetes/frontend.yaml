apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: agentmesh-frontend }
spec:
  replicas: 2
  selector: { matchLabels: { app: agentmesh-frontend } }
  template:
    metadata: { labels: { app: agentmesh-frontend } }
    spec:
      containers:
        - name: frontend
          image: agentmesh/frontend:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 3, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: frontend }
spec:
  selector: { app: agentmesh-frontend }
  ports: [{ name: http, port: 80, targetPort: http }]