apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: agentmesh-gateway }
spec:
  replicas: 2
  selector: { matchLabels: { app: agentmesh-gateway } }
  template:
    metadata: { labels: { app: agentmesh-gateway } }
    spec:
      containers:
        - name: gateway
          image: agentmesh/gateway:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: agentmesh-config } }, { secretRef: { name: agentmesh-secrets, optional: true } }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 3, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec:
  selector: { app: agentmesh-gateway }
  ports: [{ name: http, port: 8080, targetPort: http }]