apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentmesh
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.example.yaml
  - worker.yaml
  - gateway.yaml
  - frontend.yaml
  - ingress.yaml
images:
  - name: agentmesh/gateway
    newName: agentmesh/gateway
    newTag: local
  - name: agentmesh/worker
    newName: agentmesh/worker
    newTag: local
  - name: agentmesh/frontend
    newName: agentmesh/frontend
    newTag: local