services:
  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    environment:
      AGENTMESH_LLM_PROVIDER: ${AGENTMESH_LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
    expose: ["9000"]
  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway
    environment:
      AGENTMESH_WORKER_ADDR: worker:9000
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-agentmesh.run-events}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-agentmesh-runs}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
    ports: ["8080:8080"]
    depends_on: [worker]
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
    ports: ["3000:80"]
    depends_on:
      gateway:
        condition: service_healthy